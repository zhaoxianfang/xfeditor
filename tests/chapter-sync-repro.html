<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>xfEditor 章节同步回归</title>
<link rel="stylesheet" href="../css/xf_editor.min.css" />
<style>
  body { margin: 0; font-family: sans-serif; }
  #editor { width: 1200px; }
</style>
</head>
<body>
<div id="editor"><textarea style="display:none;"></textarea></div>
<script src="../xf_editor.js"></script>
<script>
(function () {
  var parts = [];
  function chapter(title, level, count) {
    var hashes = new Array(level + 1).join('#');
    parts.push(hashes + ' ' + title);
    parts.push('');
    for (var index = 1; index <= count; index++) {
      parts.push('这是「' + title + '」章节的第 ' + index + ' 段正文，用于构造足够长的章节内容，以便验证先定位章节再按内容高度比例滚动的同步逻辑。');
      parts.push('');
    }
  }

  chapter('系统说明', 2, 8);
  chapter('示例', 3, 14);
  chapter('细节', 4, 10);
  chapter('部署说明', 2, 8);
  chapter('回滚方案', 3, 12);

  var markdown = parts.join('\n');
  var dom = window.xfEditor.dom;
  dom(function () {
    window.__editor = xfEditor('editor', {
      width: '1200px',
      height: '600px',
      path: '../lib/',
      pluginPath: '../plugins/',
      markdown: markdown,
      toc: false,
      taskList: false,
      tex: false,
      toolbarIcons: function () { return ['undo', 'redo', '|', 'watch']; }
    });
    window.__ready = true;
  });
})();
</script>
</body>
</html>
