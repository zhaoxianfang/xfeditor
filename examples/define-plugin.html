### Define plugin

#### Plugin directory

    editor/
        plugins/
            plugin-name/
                ....

#### Usage plugin

```html
&lt;script src="../plugins/you-plugin-name/you-plugin-name.js"&gt;&lt;/script&gt;
&lt;script&gt;
    xfEditor.customMethod();

    var testEditor = xfEditor("test-xfEditor", {
        path   : '../lib/',
        onload : function() {
            this.youPluginName();
            this.pluginA();
            this.executePlugin("somePluginName", "you-plugin-name/you-plugin-name"); // load and execute plugin
        }
    });

    // or
    xfEditor.dom("#btn").click(function(){
        testEditor.youPluginName();
    });
&lt;/script&gt;

        <script type="text/javascript">var dom = (window.xfEditor && window.xfEditor.dom) ? window.xfEditor.dom : null; // 内置 micro-DOM（零依赖，无全局 $）

            var testEditor;
            
            xfEditor.fn.customMethod = function() {
                console.log("customMethod", this);

            xfEditor.fn.pluginA = function() {
                console.log("pluginA", this);
            };
            
            dom(function() {
                xfEditor.methodOne = function(){
                    console.log("xfEditor.methodOne");
                };
                
                xfEditor.loadPlugin("../plugins/test-plugin/test-plugin", function(){
                    xfEditor.testPlugin();
                });
                
                xfEditor.loadPlugin("../plugins/image-dialog/image-dialog", function(){
                
                    testEditor = xfEditor("test-xfEditor", {
                        width  : "90%",
                        height : 720,
                        path   : '../lib/',
                        onload : function() {
                            this.customMethod();
                            testEditor.imageDialog();
                            this.executePlugin("htmlEntitiesDialog", "html-entities-dialog/html-entities-dialog"); // load and execute plugin
                            this.pluginA();
                        }
